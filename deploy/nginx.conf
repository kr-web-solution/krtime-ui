server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Entrance tablet QR: any /qr/<slug>/ serves the statically exported placeholder page.
    # Client JS reads the real slug from the browser URL.
    location ~ ^/qr/([^/]+)/?$ {
        try_files /qr/-/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: http:; font-src 'self' data:;" always;
}
